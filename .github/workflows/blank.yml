name: deploy
on:
  push:
    branches: [main]

jobs:
  build-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "build-1"

  build-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "build-2"

  build-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "build-3"

  integration-1:
    needs: build-1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "integration-1"

  integration-2:
    needs: build-1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "integration-2"

  lint:
    needs: [build-2, build-3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "lint"

  unit-test:
    needs: build-3
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - run: echo "unit-test shard ${{ matrix.shard }}"

  deploy:
    needs: [integration-1, integration-2, lint, unit-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "deploy"
